name: .NET Build and Test

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop
        
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CounterAPI/CounterAPI.sln

      - name: Build
        run: dotnet build CounterAPI/CounterAPI.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CounterAPI/CounterAPI.sln --configuration Release --no-build --verbosity normal

      - name: Publish DotNet10API
        run: dotnet publish DotNet10API/DotNet10API.csproj -c Release -o publish --no-build